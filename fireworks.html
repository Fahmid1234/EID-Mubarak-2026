<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ঈদ মোবারক ২০২৬</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #04040f;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ── Launch button ── */
  #btn {
    position: fixed;
    bottom: clamp(16px, 4vw, 28px);
    right: clamp(16px, 4vw, 28px);
    width: clamp(52px, 12vw, 68px);
    height: clamp(52px, 12vw, 68px);
    border-radius: 50%;
    background: rgba(255,255,255,0.13);
    border: 2px solid rgba(255,255,255,0.65);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    transition: background 0.2s, transform 0.12s, border-color 0.2s;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #btn:hover  { background: rgba(255,255,255,0.26); border-color: #fff; }
  #btn:active { transform: scale(0.88); }
  #btn svg {
    width: clamp(22px, 5.5vw, 32px);
    height: clamp(22px, 5.5vw, 32px);
  }

  /* ── Hint labels ── */
  #hint {
    position: fixed;
    bottom: clamp(24px, 5vw, 40px);
    right: calc(clamp(52px,12vw,68px) + clamp(16px,4vw,28px) + 14px);
    color: rgba(255,255,255,0.45);
    font-family: Georgia, serif;
    font-size: clamp(11px, 2.5vw, 14px);
    letter-spacing: 0.06em;
    pointer-events: none;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 1.2s;
  }
  #hint.hidden { opacity: 0; }

  #vol-hint {
    position: fixed;
    top: clamp(12px, 3vw, 20px);
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,200,0.65);
    font-family: Georgia, serif;
    font-size: clamp(10px, 2.2vw, 13px);
    letter-spacing: 0.08em;
    pointer-events: none;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 1.5s;
    z-index: 200;
  }
  #vol-hint.hidden { opacity: 0; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<span id="hint">tap to launch</span>
<span id="vol-hint">🔊 turn up your volume for best experience</span>

<button id="btn" aria-label="Launch fireworks">
  <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="15" cy="15" r="2.4" fill="white"/>
    <line x1="15" y1="2"  x2="15" y2="8"  stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="15" y1="22" x2="15" y2="28" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="2"  y1="15" x2="8"  y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="22" y1="15" x2="28" y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="5.9"  y1="5.9"  x2="10.1" y2="10.1" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="19.9" y1="19.9" x2="24.1" y2="24.1" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="24.1" y1="5.9"  x2="19.9" y2="10.1" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="10.1" y1="19.9" x2="5.9"  y2="24.1" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<script>
/* ─────────────────────────────────────────────────────────────────
   FIREWORKS  ✦  ঈদুল আযহা ২০২৬  ✦  ঈদ মোবারক!!!
───────────────────────────────────────────────────────────────── */
(function(){
'use strict';

/* ══════════════════════════════════════════
   CANVAS SETUP
══════════════════════════════════════════ */
const canvas = document.getElementById('c');
const btn    = document.getElementById('btn');
const hint   = document.getElementById('hint');
const volHint= document.getElementById('vol-hint');
let W, H, ctx, DPR;
let bgCanvas  = null;
let rockets   = [], particles = [], flares = [], textBursts = [];
let autoTimer = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); // cap at 2x for perf
  W   = window.innerWidth;
  H   = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  buildBg();
}

/* ══════════════════════════════════════════
   AUDIO ENGINE  — multi-layer realistic boom
══════════════════════════════════════════ */
let AC = null;
function getAC(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}

/* Pre-generate a short white-noise buffer once */
let noiseBuffer = null;
function getNoiseBuf(ac, seconds){
  if(noiseBuffer && noiseBuffer.duration >= seconds) return noiseBuffer;
  const len = Math.ceil(ac.sampleRate * seconds);
  noiseBuffer = ac.createBuffer(2, len, ac.sampleRate);
  for(let c = 0; c < 2; c++){
    const d = noiseBuffer.getChannelData(c);
    for(let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  }
  return noiseBuffer;
}

/* ── Whistle: rising filtered noise + sine slide ── */
function playWhistle(travelSecs, panVal){
  try{
    const ac  = getAC();
    const now = ac.currentTime;
    const dur = Math.max(0.3, Math.min(travelSecs, 1.8));

    // Sine sweep (the "wheee" tone)
    const osc = ac.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220 + rand(0,80), now);
    osc.frequency.exponentialRampToValueAtTime(3400 + rand(0,600), now + dur);

    // Band-pass to make it whistle-y
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(900, now);
    bp.frequency.exponentialRampToValueAtTime(3600, now + dur);
    bp.Q.value = 3.5;

    const gOsc = ac.createGain();
    gOsc.gain.setValueAtTime(0.06, now);
    gOsc.gain.linearRampToValueAtTime(0.12, now + dur * 0.7);
    gOsc.gain.linearRampToValueAtTime(0.0,  now + dur);

    // Noise hiss layer
    const nSrc = ac.createBufferSource();
    nSrc.buffer = getNoiseBuf(ac, 2);
    nSrc.loop = true;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(2000, now);
    hp.frequency.exponentialRampToValueAtTime(8000, now + dur);
    const gN = ac.createGain();
    gN.gain.setValueAtTime(0.04, now);
    gN.gain.linearRampToValueAtTime(0.0, now + dur);

    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if(pan) pan.pan.value = Math.max(-1, Math.min(1, panVal));

    const master = ac.createGain();
    master.gain.value = 0.55;

    osc.connect(bp); bp.connect(gOsc);
    nSrc.connect(hp); hp.connect(gN);
    gOsc.connect(master);
    gN.connect(master);
    if(pan){ master.connect(pan); pan.connect(ac.destination); }
    else    { master.connect(ac.destination); }

    osc.start(now);  osc.stop(now + dur);
    nSrc.start(now); nSrc.stop(now + dur);
  }catch(e){}
}

/* ── Explosion: 4 layers for realism ── */
function playBoom(x){
  try{
    const ac  = getAC();
    const now = ac.currentTime;
    const pan = Math.max(-1, Math.min(1, ((x/W) - 0.5) * 1.6));

    const TOTAL_DUR = 3.2;
    const SR = ac.sampleRate;

    // ── Layer 1: THUD — very low pitched body punch ──
    // Synthesised by pitch-enveloping a sine down from ~80Hz
    const thudOsc = ac.createOscillator();
    thudOsc.type = 'sine';
    thudOsc.frequency.setValueAtTime(90 + rand(-10,10), now);
    thudOsc.frequency.exponentialRampToValueAtTime(28, now + 0.18);
    const thudGain = ac.createGain();
    thudGain.gain.setValueAtTime(0.0, now);
    thudGain.gain.linearRampToValueAtTime(1.0, now + 0.005);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    // ── Layer 2: CRACK — sharp transient white-noise burst ──
    const crackLen = Math.ceil(SR * 0.12);
    const crackBuf = ac.createBuffer(1, crackLen, SR);
    const crackD   = crackBuf.getChannelData(0);
    for(let i=0; i<crackLen; i++){
      const t = i/SR;
      crackD[i] = (Math.random()*2-1) * Math.exp(-t*90);
    }
    const crackSrc = ac.createBufferSource();
    crackSrc.buffer = crackBuf;
    const crackHP = ac.createBiquadFilter();
    crackHP.type = 'highpass'; crackHP.frequency.value = 3000;
    const crackGain = ac.createGain();
    crackGain.gain.setValueAtTime(1.8, now);
    crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

    // ── Layer 3: RUMBLE — medium low-frequency noise decay ──
    const rumbleLen = Math.ceil(SR * 1.4);
    const rumbleBuf = ac.createBuffer(2, rumbleLen, SR);
    for(let c=0;c<2;c++){
      const d = rumbleBuf.getChannelData(c);
      for(let i=0;i<rumbleLen;i++){
        const t = i/SR;
        d[i] = (Math.random()*2-1) * Math.exp(-t*4.5);
      }
    }
    const rumbleSrc  = ac.createBufferSource();
    rumbleSrc.buffer = rumbleBuf;
    const rumbleLP   = ac.createBiquadFilter();
    rumbleLP.type = 'lowpass'; rumbleLP.frequency.value = 280; rumbleLP.Q.value = 1.2;
    const rumbleGain = ac.createGain();
    rumbleGain.gain.setValueAtTime(0.9, now);
    rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

    // ── Layer 4: SIZZLE — high-freq sparkle tail ──
    const sizzleLen = Math.ceil(SR * TOTAL_DUR);
    const sizzleBuf = ac.createBuffer(2, sizzleLen, SR);
    for(let c=0;c<2;c++){
      const d = sizzleBuf.getChannelData(c);
      for(let i=0;i<sizzleLen;i++){
        const t = i/SR;
        // Sparse crackle: occasional spikes in decaying noise
        const sparse = Math.random() < 0.15 ? (Math.random()*2-1)*1.5 : (Math.random()*2-1)*0.2;
        d[i] = sparse * Math.exp(-t * 1.8);
      }
    }
    const sizzleSrc  = ac.createBufferSource();
    sizzleSrc.buffer = sizzleBuf;
    const sizzleHP   = ac.createBiquadFilter();
    sizzleHP.type = 'highpass'; sizzleHP.frequency.value = 4500;
    const sizzleGain = ac.createGain();
    sizzleGain.gain.setValueAtTime(0.55, now);
    sizzleGain.gain.exponentialRampToValueAtTime(0.001, now + TOTAL_DUR);

    // ── Layer 5: ECHO — delayed faint repeat ──
    const echoDelay = ac.createDelay(0.5);
    echoDelay.delayTime.value = 0.22 + rand(0,0.12);
    const echoGain  = ac.createGain();
    echoGain.gain.value = 0.22;
    const echoFb    = ac.createGain();
    echoFb.gain.value = 0.35;

    // ── Reverb-like convolver (impulse response) ──
    const revLen  = Math.ceil(SR * 2.5);
    const revBuf  = ac.createBuffer(2, revLen, SR);
    for(let c=0;c<2;c++){
      const d = revBuf.getChannelData(c);
      for(let i=0;i<revLen;i++){
        d[i] = (Math.random()*2-1) * Math.pow(1 - i/revLen, 2.2);
      }
    }
    const conv = ac.createConvolver();
    conv.buffer = revBuf;
    const convGain = ac.createGain();
    convGain.gain.value = 0.28;

    // ── Compressor + Master gain ──
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value       = 8;
    comp.ratio.value      = 5;
    comp.attack.value     = 0.002;
    comp.release.value    = 0.30;

    const masterGain = ac.createGain();
    masterGain.gain.value = 0.82 + rand(-0.1, 0.15);

    const panner = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if(panner) panner.pan.value = pan;

    // Wire it all up
    const dry = ac.createGain(); dry.gain.value = 1.0;

    thudOsc.connect(thudGain);
    crackSrc.connect(crackHP); crackHP.connect(crackGain);
    rumbleSrc.connect(rumbleLP); rumbleLP.connect(rumbleGain);
    sizzleSrc.connect(sizzleHP); sizzleHP.connect(sizzleGain);

    [thudGain, crackGain, rumbleGain, sizzleGain].forEach(g => {
      g.connect(dry);
      g.connect(conv);
    });

    conv.connect(convGain);
    dry.connect(echoDelay);
    echoDelay.connect(echoGain);
    echoGain.connect(echoFb);
    echoFb.connect(echoDelay);
    echoGain.connect(comp);

    dry.connect(comp);
    convGain.connect(comp);
    comp.connect(masterGain);

    if(panner){ masterGain.connect(panner); panner.connect(ac.destination); }
    else       { masterGain.connect(ac.destination); }

    thudOsc.start(now);  thudOsc.stop(now + 0.6);
    crackSrc.start(now); crackSrc.stop(now + 0.12);
    rumbleSrc.start(now);rumbleSrc.stop(now + 1.4);
    sizzleSrc.start(now);sizzleSrc.stop(now + TOTAL_DUR);
  }catch(e){}
}

/* ══════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════ */
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(a)  { return a[Math.floor(Math.random()*a.length)]; }

function hexAlpha(hex,a){
  a = Math.max(0, Math.min(1, a));
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

// Responsive scale: particle count / size relative to screen
function vmin(){ return Math.min(W, H); }

const PALETTES = [
  {core:'#ff3333',bright:'#ff9988',white:'#fff0ee'},
  {core:'#ff8800',bright:'#ffcc44',white:'#fff8e0'},
  {core:'#ffee00',bright:'#ffff99',white:'#fffff5'},
  {core:'#33ffaa',bright:'#99ffdd',white:'#eeffee'},
  {core:'#33aaff',bright:'#88ddff',white:'#e8f8ff'},
  {core:'#bb33ff',bright:'#dd99ff',white:'#f8eeff'},
  {core:'#ff33cc',bright:'#ff99ee',white:'#ffe8ff'},
  {core:'#ffffff',bright:'#cce8ff',white:'#eef4ff'},
  {core:'#ff5522',bright:'#ffaa88',white:'#fff2ee'},
  {core:'#00eeff',bright:'#88ffff',white:'#eeffff'},
  {core:'#aaff00',bright:'#ddff88',white:'#f8ffe8'},
];

/* ══════════════════════════════════════════
   TEXT BURST  (canvas-rendered Bengali message)
══════════════════════════════════════════ */
const MSG1 = 'ঈদুল আযহা ২০২৬';
const MSG2 = 'ঈদ মোবারক!!!';

class TextBurst {
  constructor(){
    this.alpha    = 0;
    this.phase    = 'in';
    this.holdTime = 0;
    this.maxHold  = 200;
    this.fadeSpd  = 0.038;
    // Orbiting sparkle ring around text
    this.sparks = Array.from({length:80}, ()=>({
      x:  W/2 + rand(-W*0.32, W*0.32),
      y:  H*0.37 + rand(-50, 50),
      vx: rand(-1.8, 1.8),
      vy: rand(-2.5, 0.2),
      s:  rand(1.2, 4.2),
      col:pick(['#ffe87a','#fff8c0','#ffcc44','#ffffff','#ffaa44','#ff8844']),
      a:  rand(0.7,1)
    }));
  }

  update(){
    if(this.phase==='in'){
      this.alpha += this.fadeSpd;
      if(this.alpha >= 1){ this.alpha=1; this.phase='hold'; }
    } else if(this.phase==='hold'){
      this.holdTime++;
      if(this.holdTime >= this.maxHold) this.phase='out';
    } else {
      this.alpha -= this.fadeSpd * 0.45;
    }
    for(const s of this.sparks){
      s.x += s.vx; s.y += s.vy; s.vy -= 0.018;
      s.a -= 0.003 + 0.002*Math.random();
    }
    this.sparks = this.sparks.filter(s=>s.a>0);
    return this.alpha > 0.005;
  }

  draw(){
    const cx = W/2;
    const vm = vmin();
    // Text centre: upper 40% of screen
    const cy = H * 0.38;
    const a  = this.alpha;

    // Sparkles
    for(const s of this.sparks){
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(s.col, s.a * a);
      ctx.fill();
    }

    // Background halo glow (radial gradient)
    const hR   = Math.min(vm*0.6, W*0.55);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, hR);
    grad.addColorStop(0,   `rgba(255,200,50,${0.28*a})`);
    grad.addColorStop(0.45,`rgba(255,130,20,${0.13*a})`);
    grad.addColorStop(1,   `rgba(0,0,0,0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(cx - hR, cy - hR, hR*2, hR*2);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';

    // ── Line 1 ──
    const fs1 = Math.min(vm * 0.082, W * 0.068, 62);
    ctx.font = `700 ${fs1}px 'Noto Serif Bengali', 'Kalpurush', serif`;

    // Outer glow passes
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 55;
    ctx.fillStyle   = hexAlpha('#ffe87a', 0.55);
    ctx.fillText(MSG1, cx, cy - fs1*0.95);

    ctx.shadowBlur  = 22;
    ctx.shadowColor = '#fff8a0';
    ctx.fillStyle   = '#fff6c0';
    ctx.fillText(MSG1, cx, cy - fs1*0.95);

    // ── Line 2 ──
    const fs2 = Math.min(vm * 0.118, W * 0.098, 90);
    ctx.font = `900 ${fs2}px 'Noto Serif Bengali', 'Kalpurush', serif`;

    // Deep warm glow
    ctx.shadowColor = '#ff9900'; ctx.shadowBlur = 65;
    ctx.fillStyle   = hexAlpha('#ffcc44', 0.6);
    ctx.fillText(MSG2, cx, cy + fs2*0.72);

    // Mid glow
    ctx.shadowColor = '#ffe060'; ctx.shadowBlur = 30;
    ctx.fillStyle   = '#ffdd66';
    ctx.fillText(MSG2, cx, cy + fs2*0.72);

    // White crisp core
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
    ctx.fillStyle   = '#ffffff';
    ctx.fillText(MSG2, cx, cy + fs2*0.72);

    ctx.restore();
  }
}

/* ══════════════════════════════════════════
   ROCKET
══════════════════════════════════════════ */
class Rocket {
  constructor(){
    this.x  = rand(W*0.1, W*0.9);
    this.y  = H + 5;
    const tX = rand(W*0.08, W*0.92);
    const tY = rand(H*0.06, H*0.42);
    const dist  = Math.hypot(tX-this.x, tY-this.y);
    const speed = rand(13, 20);
    const t = dist / speed;
    this.vx = (tX-this.x)/t;
    this.vy = (tY-this.y)/t;
    this.targetY = tY;
    this.pal   = pick(PALETTES);
    this.trail = [];
    this.done  = false;
    // Whistle — pan based on x
    const panVal = ((this.x/W) - 0.5) * 1.4;
    playWhistle(dist/speed/60, panVal);
  }

  update(){
    this.trail.push({x:this.x, y:this.y});
    if(this.trail.length > 26) this.trail.shift();
    this.x  += this.vx;
    this.y  += this.vy;
    this.vy += 0.055;
    if(this.y <= this.targetY || this.vy >= 0){
      this.done = true;
      burst(this.x, this.y, this.pal);
      flares.push(new Flash(this.x, this.y, this.pal));
      playBoom(this.x);
    }
  }

  draw(){
    for(let i=1; i<this.trail.length; i++){
      const a = i/this.trail.length;
      ctx.beginPath();
      ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
      ctx.lineTo(this.trail[i].x,   this.trail[i].y);
      ctx.strokeStyle = `rgba(255,220,110,${a*0.88})`;
      ctx.lineWidth   = a * 2.8;
      ctx.lineCap     = 'round';
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.8, 0, Math.PI*2);
    ctx.fillStyle = '#fffde0';
    ctx.fill();
  }
}

/* ══════════════════════════════════════════
   PARTICLE
══════════════════════════════════════════ */
class Particle {
  constructor(x,y,pal,type){
    this.x=x; this.y=y; this.type=type||'main'; this.pal=pal;
    const scale = vmin()/600; // scale speed to screen size
    const angle = rand(0, Math.PI*2);
    let spd;
    if(type==='ring')    spd = rand(5.5,8.5)*scale;
    else if(type==='tail')    spd = rand(1.5,4.5)*scale;
    else if(type==='shimmer') spd = rand(3,9)*scale;
    else if(type==='star')    spd = rand(2,7)*scale;
    else                      spd = rand(2,9)*scale;
    this.vx  = Math.cos(angle)*spd;
    this.vy  = Math.sin(angle)*spd;
    this.alpha   = 1;
    this.gravity = (type==='tail') ? 0.035*scale : 0.072*scale;
    this.drag    = (type==='ring') ? 0.977 : rand(0.94,0.982);
    this.size    = (type==='shimmer') ? rand(0.7,1.6) : rand(1.2,3.2);
    this.size   *= Math.max(0.6, scale);
    this.decay   = (type==='shimmer') ? rand(0.016,0.030) : rand(0.009,0.020);
    this.tail    = [];
    this.tailLen = (type==='main'||type==='star') ? Math.floor(rand(5,11)) : 0;
  }

  update(){
    if(this.tailLen>0){
      this.tail.push({x:this.x, y:this.y, a:this.alpha});
      if(this.tail.length > this.tailLen) this.tail.shift();
    }
    this.x   += this.vx;
    this.y   += this.vy;
    this.vy  += this.gravity;
    this.vx  *= this.drag;
    this.vy  *= this.drag;
    this.alpha -= this.decay;
    return this.alpha > 0.01;
  }

  draw(){
    const p = this.pal;
    const col = this.alpha>0.72 ? p.white : (this.alpha>0.38 ? p.bright : p.core);
    for(let i=0; i<this.tail.length; i++){
      const t  = this.tail[i];
      const ta = (i/this.tail.length)*t.a*0.45;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size*0.55, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(p.core, ta);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = hexAlpha(col, this.alpha);
    ctx.fill();
    if(this.alpha>0.38 && this.size>1.4){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size*2.8, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(p.core, this.alpha*0.10);
      ctx.fill();
    }
  }
}

/* ══════════════════════════════════════════
   FLASH
══════════════════════════════════════════ */
class Flash {
  constructor(x,y,pal){
    this.x=x; this.y=y; this.pal=pal;
    this.r=0; this.alpha=1;
    this.maxR = rand(50,110) * (vmin()/600);
  }
  update(){ this.r+=this.maxR*0.16; this.alpha*=0.68; return this.alpha>0.01; }
  draw(){
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle = hexAlpha(this.pal.white, this.alpha*0.28); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.38,0,Math.PI*2);
    ctx.fillStyle = hexAlpha('#ffffff', this.alpha*0.65); ctx.fill();
  }
}

/* ══════════════════════════════════════════
   BURST  (adaptive particle count)
══════════════════════════════════════════ */
function burst(x,y,pal){
  // Reduce on small screens for performance
  const scale = Math.min(1, vmin()/500);
  const n     = Math.floor(rand(90,170) * scale);
  for(let i=0;i<n;i++) particles.push(new Particle(x,y,pal,'main'));

  const ring = Math.floor(rand(22,38)*scale);
  for(let i=0;i<ring;i++){
    const p = new Particle(x,y,pal,'ring');
    const a = (i/ring)*Math.PI*2, s = rand(5.5,8.5)*(vmin()/600);
    p.vx = Math.cos(a)*s; p.vy = Math.sin(a)*s;
    particles.push(p);
  }
  for(let i=0;i<Math.floor(rand(12,22)*scale);i++) particles.push(new Particle(x,y,pal,'tail'));
  for(let i=0;i<Math.floor(rand(16,28)*scale);i++) particles.push(new Particle(x,y,pal,'shimmer'));
  for(let i=0;i<Math.floor(rand(8,16)*scale);i++)  particles.push(new Particle(x,y,pal,'star'));
}

/* ══════════════════════════════════════════
   BACKGROUND  (city skyline + stars)
══════════════════════════════════════════ */
function buildBg(){
  bgCanvas = document.createElement('canvas');
  bgCanvas.width  = W;
  bgCanvas.height = H;
  const bctx = bgCanvas.getContext('2d');

  // Sky
  bctx.fillStyle = '#04040f'; bctx.fillRect(0,0,W,H);

  // Stars (fewer on mobile)
  const starCount = Math.floor(Math.min(W,H) < 500 ? 120 : 220);
  for(let i=0;i<starCount;i++){
    const sx=rand(0,W), sy=rand(0,H*0.78), sr=rand(0.3,1.2), sa=rand(0.3,1);
    bctx.beginPath(); bctx.arc(sx,sy,sr,0,Math.PI*2);
    bctx.fillStyle=`rgba(255,255,255,${sa})`; bctx.fill();
  }

  // Skyline
  const bw  = Math.max(12, W/24);
  const cnt = Math.ceil(W/bw) + 2;
  bctx.fillStyle = '#080809';
  for(let i=0;i<cnt;i++){
    const bx  = (i/cnt)*W - bw*0.5;
    const bwi = rand(bw*0.6, bw*1.2);
    const bhi = rand(H*0.06, H*0.24);
    const by  = H - bhi;
    bctx.fillRect(bx, by, bwi, bhi);
    // Windows
    const rows = Math.floor(bhi/14), cols = Math.floor(bwi/9);
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(Math.random()<0.2){
          bctx.fillStyle=`rgba(255,240,180,${rand(0.07,0.26)})`;
          bctx.fillRect(bx+c*9+2, by+r*14+3, 5, 8);
          bctx.fillStyle='#080809';
        }
      }
    }
  }
  // Ground strip
  bctx.fillStyle='#050506';
  bctx.fillRect(0, H*0.91, W, H*0.09+2);
}

/* ══════════════════════════════════════════
   RENDER LOOP
══════════════════════════════════════════ */
function frame(){
  ctx.clearRect(0,0,W,H);
  if(bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

  // Text under particle glow
  ctx.globalCompositeOperation = 'source-over';
  textBursts = textBursts.filter(tb=>{ tb.draw(); return tb.update(); });

  ctx.globalCompositeOperation = 'lighter';
  flares    = flares.filter(f=>{ f.draw(); return f.update(); });
  particles = particles.filter(p=>{ p.draw(); return p.update(); });

  ctx.globalCompositeOperation = 'source-over';
  rockets   = rockets.filter(r=>{ r.draw(); r.update(); return !r.done; });

  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════
   LAUNCH
══════════════════════════════════════════ */
let textShown = false;

function launchSalvo(){
  hint.classList.add('hidden');
  volHint.classList.add('hidden');
  if(autoTimer) clearTimeout(autoTimer);
  textShown = false;

  const isMobile  = vmin() < 500;
  const total     = Math.floor(rand(isMobile ? 6 : 9, isMobile ? 12 : 16));
  let   fired     = 0;

  function fire(){
    if(fired >= total) return;
    rockets.push(new Rocket());
    fired++;
    if(fired === 3 && !textShown){
      textShown = true;
      setTimeout(()=>{ textBursts.push(new TextBurst()); }, 1100);
    }
    autoTimer = setTimeout(fire, rand(180, 700));
  }
  fire();
}

/* ══════════════════════════════════════════
   EVENTS
══════════════════════════════════════════ */
btn.addEventListener('click',       launchSalvo);
btn.addEventListener('touchstart',  e=>{ e.preventDefault(); launchSalvo(); }, {passive:false});

window.addEventListener('resize', ()=>{
  clearTimeout(window._rzTimer);
  window._rzTimer = setTimeout(resize, 120);
});

// Also support tapping anywhere on canvas (optional bonus)
canvas.addEventListener('click', launchSalvo);

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
resize();
frame();
setTimeout(()=> volHint.classList.add('hidden'), 5000);

})();
</script>
